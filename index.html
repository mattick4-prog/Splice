<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Splice</title></head><body>
<title>Splice: Millbrook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed canvas game; overlay cards for title, base stations, genome screen and story beats. Single committed dark UI over a brighter game world. */
:root{
  --bg:#0f1210; --panel:#171b19; --panel2:#1f2522; --ink:#efe9dc; --muted:#a39e91; --line:#323a36;
  --human:#7fc8ff; --monster:#c27bff; --toxic:#b8e04a; --blood:#ff5a68; --gold:#ffd166;
  --display:"Creepster","Impact",fantasy; --body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
canvas{display:block;touch-action:none}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,5,5,.7);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;z-index:5}
#ov.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:880px;width:100%;max-height:calc(100% - 8px);overflow:auto;padding:22px 24px;box-sizing:border-box;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card.wide{max-width:1080px}
.card.story{max-width:640px;font-size:20px;line-height:1.45}
h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,11vw,112px);margin:0;line-height:.9;color:var(--toxic);letter-spacing:3px;text-wrap:balance}
h1.mon{color:var(--monster)}
h2{font-family:var(--display);font-weight:400;font-size:40px;margin:0;letter-spacing:1px;line-height:1}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;font-weight:600}
h3 small{text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
p{margin:0 0 12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sub{font-size:22px;opacity:.85;margin:10px 0 18px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
section{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
ul{margin:0;padding-left:18px;line-height:1.4}
li{margin-bottom:4px}
kbd{font-family:var(--mono);font-size:12px;background:#000;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:17px}
.btn{font-family:var(--body);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;background:var(--toxic);color:#10140b;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,.x:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.big{font-size:24px;padding:14px 30px}
.btn.mon{background:var(--monster);color:#1a0b24}
.btn.sm{font-size:14px;padding:6px 10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#241a00}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.x{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;font-size:18px;width:38px;height:38px;cursor:pointer;flex:none}
.cost{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cost span{font-family:var(--mono);font-size:13px;padding:3px 7px;border-radius:4px;background:#0006;border:1px solid var(--line)}
.cost .no{color:var(--blood);border-color:#5a2028}
.cost .ok{color:var(--toxic)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0}
.act small{color:var(--muted);display:block}
.tag{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:3px;background:#000;border:1px solid var(--line);margin-left:4px;white-space:nowrap}
.mute{color:var(--muted)}
.pick{outline:2px solid var(--monster)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-variant-numeric:tabular-nums}
.stats b{display:block;font-size:28px}
.stats span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.story p{font-size:20px}
.story em{color:var(--monster);font-style:normal}
/* genome */
.gslots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}
@media (max-width:640px){.gslots{grid-template-columns:1fr}}
.gs{background:#0008;border:2px solid var(--c,#333);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0}
.gs .k{font-family:var(--mono);font-size:22px;color:var(--muted);width:26px;text-align:center}
.gs b{display:block;font-size:19px}
.gs small{color:var(--muted)}
.gene{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gc.on{border-color:var(--c)}
.gc .top{display:flex;gap:10px;align-items:center}
.gc .ic{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-size:24px;background:#0008;border:2px solid var(--c);flex:none}
.gc .nm{min-width:0;flex:1}
.gc .nm b{display:block;font-size:19px;line-height:1.1}
.gc small{color:var(--muted);font-size:14px;line-height:1.3}
.gc.locked .ic{filter:grayscale(1);opacity:.6}
.dbar{position:relative;height:12px;background:#000;border-radius:6px;margin-top:2px}
.dbar i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.dbar .tk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.tks{position:relative;height:14px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.tks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tks span:last-child{transform:none;right:0}
.eq{display:flex;gap:6px;flex-wrap:wrap}
.lvl{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;background:var(--c);color:#111;font-weight:700}
.lvl.none{background:#333;color:var(--muted)}
.wp{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wp .ic{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:24px;background:#0008;border:1px solid var(--line)}
.wp small{display:block;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#toolbar{position:fixed;left:12px;top:262px;display:none;flex-direction:column;gap:6px;z-index:5}
#toolbar button{display:flex;align-items:center;gap:8px;min-width:132px;background:rgba(15,18,16,.88);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font:600 16px var(--body);cursor:pointer;text-align:left}
#toolbar button:hover{border-color:var(--gold)}#toolbar span{font-size:18px}#toolbar b{flex:1;font-weight:600}
#carui{position:fixed;right:16px;bottom:16px;width:min(470px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;display:none;z-index:6;background:rgba(14,12,11,.93);border:1px solid #4a4038;border-radius:12px;padding:10px;font-family:var(--body);color:var(--ink)}
#carui .ch{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;font-size:17px}#carui .ch span{color:var(--muted);font-size:14px}
#carui button{position:relative;display:block;width:100%;text-align:left;background:#211c19;border:1px solid #3e3631;border-radius:8px;color:var(--ink);padding:7px 8px 7px 34px;cursor:pointer;font:inherit;touch-action:none}
#carui button:hover{border-color:var(--gold)}#carui button b{display:block;font-size:15px;font-weight:700}#carui button small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
#carui button .k{position:absolute;left:7px;top:8px;font:700 11px var(--mono);background:#000;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--gold)}
#carui button .i{float:right;font-size:20px;margin-left:4px}
#carui button.on{border-color:var(--gold);background:#3a2f12}#carui button.done{opacity:.55}
#carui .quiet{padding-left:66px;margin-bottom:8px;border-color:#3a5a7a;background:#14202c}#carui .quiet.on{background:#1e3a55;border-color:var(--human)}
#carui .qb{display:block;height:7px;background:#000;border-radius:4px;margin-top:5px;overflow:hidden}#carui .qb i{display:block;height:100%;background:var(--human)}
#carui .cg{display:grid;grid-template-columns:1fr 1fr;gap:6px}#carui .out{grid-column:1/-1;border-color:#6a3a3a}
#carui .cm{margin-top:8px;padding:8px 10px;border-left:3px solid var(--gold);background:#1c1813;font-size:15px}
.flow{display:flex;align-items:stretch;gap:6px;margin:12px 0 10px;flex-wrap:wrap}
.flow>div{flex:1 1 150px;position:relative;background:#0006;border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 40px;min-width:0}
.flow>div .n{position:absolute;left:10px;top:9px;font:700 13px var(--mono);color:var(--muted)}.flow>div .i{float:right;font-size:20px}
.flow>div b{display:block;font-size:16px}.flow>div small{color:var(--muted);font-size:13px;line-height:1.25;display:block}
.flow>div.on{border-color:var(--gold);background:#2a2410}.flow>div.on .n{color:var(--gold)}
.flow .ar{align-self:center;color:var(--muted);font-size:18px}
@media (max-width:760px){.flow .ar{display:none}}
.next{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-left:4px solid var(--gold);background:#1e1a10;border-radius:8px;padding:10px 12px;font-size:17px;margin-bottom:6px}
h4.lbl{margin:14px 0 6px;font:700 15px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}h4.lbl small{text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500;margin-left:6px}
.gtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:16px 0 0}
.gtabs button{text-align:left;background:#0006;border:1px solid var(--line);border-bottom:3px solid transparent;border-radius:8px 8px 0 0;color:var(--ink);padding:8px 10px;cursor:pointer;font:inherit}
.gtabs button span{float:right;font-size:18px}.gtabs button b{display:block;font-size:16px}.gtabs button small{display:block;color:var(--muted);font-size:12px}
.gtabs button.on{background:var(--panel2);border-color:var(--gold);border-bottom-color:var(--gold)}.gtabs button:hover{border-color:var(--gold)}
.gtabs em{font-style:normal;background:var(--gold);color:#111;border-radius:9px;padding:0 7px;margin-left:6px;font-size:13px}
.tabintro{background:var(--panel2);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:8px 12px;margin-bottom:12px;color:var(--muted)}
.gc .st{font-weight:700;font-size:15px;border-radius:6px;padding:5px 8px}.gc .st.ok{background:#16301c;color:#9dffb2}.gc .st.go{background:#3a2f12;color:var(--gold)}.gc .st.no{background:#0006;color:var(--muted)}
.gc .what{margin:0;font-size:15px;line-height:1.35}
.gc .eq{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.gc .eq .btn{min-width:42px}
.gc .mods{display:grid;gap:4px}
details.fam summary{cursor:pointer;color:var(--muted);margin-bottom:6px}
#tip{position:fixed;z-index:50;display:none;max-width:320px;pointer-events:none;background:rgba(10,12,11,.96);border:1px solid var(--gold);border-radius:8px;padding:8px 10px;font:500 15px/1.35 var(--body);color:var(--ink);box-shadow:0 6px 20px #0008}
#tip b{display:block;color:var(--gold);font-size:16px;margin-bottom:2px}#tip span{display:block}
.ladder{display:flex;gap:8px;overflow-x:auto;padding:6px 2px}.rung{display:grid;gap:6px;justify-items:center}
.tile{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font:700 22px var(--mono);color:#111;border:3px solid transparent;user-select:none}
.tile[role=button]{cursor:pointer}.tile[role=button]:hover{outline:2px solid var(--gold)}
.bond{width:6px;height:16px;background:#555}.big2{font-size:19px;margin:6px 0}
.pairrule{display:inline-block;background:#000;border:1px solid var(--line);border-radius:6px;padding:3px 10px;font:700 18px var(--mono)}
.howto{background:#0006;border:1px solid var(--gold);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:18px}.howto p{margin:6px 0}
.howline{margin:6px 0;font-size:16px;color:var(--muted)}
.hb{display:block;width:40px;height:4px;background:#aaa;border-radius:2px}.hb.q{height:auto;background:none;text-align:center;color:var(--gold);font-weight:700}
.spinbar{position:relative;height:42px;background:#000;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.spinbar .zone{position:absolute;top:0;bottom:0;background:#2f8a3a}#needle{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:#fff;box-shadow:0 0 8px #fff}
.gel{display:grid;gap:6px;margin-top:6px}.frag{position:relative;text-align:left;background:#101820;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px 10px;cursor:pointer;font:inherit;min-height:40px}
.frag span{position:absolute;left:0;top:0;bottom:0;background:#4aa8ff44;border-right:3px solid #4aa8ff}.frag b{position:relative}.frag.done{opacity:.5}.frag.bad{border-color:#ff5a68}
.tube{position:relative;width:54px;height:160px;border:3px solid #9ab;border-top:0;border-radius:0 0 26px 26px;overflow:hidden;background:#0008}
.tube .liq{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#7fd6ff,#2a7ab0)}.tube .line{position:absolute;left:-4px;right:-4px;height:3px;background:var(--gold)}
.laborder{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}.laborder span{display:grid;justify-items:center;background:#0006;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:20px}
.laborder span small{font-size:11px;color:var(--muted)}.laborder span.on{border-color:var(--gold);background:#2a2410}
.act.part{border-radius:8px}.act.part.installed{opacity:.75}
.logrow{display:flex;gap:8px;align-items:baseline;padding:5px 2px;border-bottom:1px solid #ffffff10;font-size:16px}.logrow .lc,.logrow .lt{flex:none}
.machine{position:relative;background:linear-gradient(180deg,#5a6268,#3a4045 60%,#2e3337);border:3px solid #1c2024;border-radius:18px;padding:14px 18px 16px;box-shadow:inset 0 2px 0 #8a939a,inset 0 -3px 0 #1a1d20,0 8px 24px #0008}
.machine .screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(#c8ccd0,#555);box-shadow:inset 0 0 0 1px #222}.s1{top:8px;left:8px}.s2{top:8px;right:8px}.s3{bottom:8px;left:8px}.s4{bottom:8px;right:8px}
.mtop{display:flex;justify-content:space-between;align-items:center;margin:0 6px 10px}.plate{font:700 14px var(--mono);letter-spacing:.12em;background:linear-gradient(#d8c890,#a89860);color:#2a2410;padding:3px 10px;border-radius:4px;box-shadow:inset 0 1px 0 #fff8}
.mlights{display:flex;gap:8px}.mlights i{width:12px;height:12px;border-radius:50%;background:var(--lc);box-shadow:0 0 8px var(--lc);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.scr{background:#0b1a12;border:4px solid #111;border-radius:12px;padding:12px 14px;box-shadow:inset 0 0 30px #000,inset 0 0 0 1px #2a5a3a;background-image:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px);min-height:160px}
.scrhead{font:700 13px var(--mono);color:#7dff9a;letter-spacing:.08em;border-bottom:1px dashed #2a5a3a;padding-bottom:6px;margin-bottom:8px}
.deck{margin-top:14px;background:linear-gradient(#2a2f33,#22262a);border-radius:12px;padding:12px;box-shadow:inset 0 2px 6px #000a}
.deckrow{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.arc{display:grid;justify-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--ink);font:inherit;padding:0}
.arc.big .cap{width:110px;height:110px;font-size:24px}.arc small{font-size:12px;color:#c8ccd0}

.ledbar{height:14px;background:#000;border-radius:4px;overflow:hidden;border:1px solid #2a5a3a}.ledbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#7dff9a 0 10px,#0b1a12 10px 13px)}
.intro{display:flex;gap:16px;align-items:flex-start}.bigic{font-size:64px;line-height:1}
.ticket{background:#f4efe2;color:#222;max-width:340px;margin:0 auto;padding:14px 16px 18px;text-align:center;font-family:var(--mono);clip-path:polygon(0 0,100% 0,100% 94%,95% 100%,90% 94%,85% 100%,80% 94%,75% 100%,70% 94%,65% 100%,60% 94%,55% 100%,50% 94%,45% 100%,40% 94%,35% 100%,30% 94%,25% 100%,20% 94%,15% 100%,10% 94%,5% 100%,0 94%)}
.ticket .tk1{letter-spacing:.2em;font-size:12px;border-bottom:1px dashed #999;padding-bottom:4px}.ticket .tk2{font-size:30px;font-weight:800;text-shadow:0 1px 0 #0003}.ticket .stars{color:#e0a800;font-size:22px}.ticket .tk3{font-size:20px;font-weight:700}.ticket .mute{color:#666}.ticket .tksci{font-size:12px;color:#444;margin-top:8px;text-align:left}
.rack{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;padding:12px;background:linear-gradient(#6a4a2a,#4a321c);border-radius:10px;box-shadow:inset 0 -6px 0 #2a1a0c}
.ttube{display:grid;justify-items:center;gap:3px;background:none;border:0;cursor:pointer;color:#fff;font:inherit;width:86px}.ttube:hover .glass{transform:translateY(-6px);box-shadow:0 0 14px #7dff9a}
.glass{position:relative;width:34px;height:96px;border:3px solid #cde;border-top-width:5px;border-radius:4px 4px 18px 18px;background:#ffffff18;overflow:hidden;transition:transform .12s}
.liq2{position:absolute;left:0;right:0;bottom:0;opacity:.85}.gi{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:16px}
.ttube b{font-size:13px;line-height:1.1;text-align:center}.ttube small{font-size:11px;font-weight:700}
.scr .tile{box-shadow:0 0 10px #0008}.scr .howline{color:#a8e8b8;font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
.mbtn{display:grid;grid-template-columns:auto 1fr;column-gap:10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);cursor:pointer;font:inherit}
.mbtn span{grid-row:span 2;font-size:28px;align-self:center}.mbtn b{font-size:18px}.mbtn small{color:var(--muted)}.mbtn:hover{border-color:var(--gold)}.mbtn.gold{border-color:var(--gold);background:#2a2410}
.arc .cap{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font:800 28px var(--mono);color:#111;border:3px solid #111;
  background:radial-gradient(circle at 35% 28%,var(--al) 0,var(--ac) 42%,var(--ad) 100%);box-shadow:0 8px 0 var(--ad),0 10px 16px #000c,inset 0 -5px 8px #0005,inset 0 3px 4px #fff6;transition:transform .05s,box-shadow .05s;text-shadow:0 1px 0 #fff7}
.arc:hover .cap{filter:brightness(1.12)}.arc:active .cap{transform:translateY(7px);box-shadow:0 1px 0 var(--ad),0 2px 4px #000a,inset 0 -3px 6px #0005}
.arc{position:relative}.arc::before{content:"";position:absolute;top:-6px;left:50%;width:96px;height:96px;margin-left:-48px;border-radius:50%;background:radial-gradient(#0000 55%,#0008 56%,#1118 70%,#0000 72%);pointer-events:none}
.arc.big::before{width:128px;height:128px;margin-left:-64px}
.helix{display:flex;justify-content:space-between;height:34px;margin:-4px 0 8px;opacity:.85}

function damagePlayer(dmg,src,kind){
  const P=S.P;if(P.dead||P.dashT>0||P.leap)return;
  if((kind==='fire'||kind==='burn')&&(hasTrait('firewalker')||P.buffs.fireimm>0))return;
  const car=P.car||P.hidden;
  if(car){car.hp-=dmg*.7*(car.locked&&P.hidden===car?.7:1);if(P.hidden===car)S.carGrime=Math.min(1,(S.carGrime||0)+.15);car.flash=.12;S.shake=Math.min(6,S.shake+2);if(car.hp<=0)wreckCar(car);return;}
  dmg*=DIFFS[S.diff].edmg;if(P.posted)dmg*=.5;
  if(P.hexT>0)dmg*=1.5;
  if(hasTrait('coldblood'))dmg*=.9;
  if(P.armorT>0)dmg*=(S.mode==='monster'&&S.resist.includes('metal'))?.6:.3;
  if(src&&src.kind==='monster'&&!src.dead){
    if(P.buffs.thorns>0){dmgFoe(src,dmg*1.2+6,null,false);if(P.buffs.thornSt)applyStatus(src,P.buffs.thornSt,1);}
    if(hasTrait('thornskin'))dmgFoe(src,dmg*.3+2,null,true);
    if(hasTrait('toxicblood'))applyStatus(src,'poison',1);
  }
  P.hp-=dmg;if(P.hurtT<=0)sfx('hurt');P.hurtT=.18;S.shake=Math.min(9,S.shake+dmg*.35);
  if(P.hp<=0)playerDown(src);
}
function dmgFoe(e,amt,src,quiet,opt){
  if(e.dead)return;opt=opt||{};
  if(src&&e.resist&&e.resist.includes(src)){amt*=.4;if(!quiet&&Math.random()<.3)floatText(e.x,e.y-e.r-18,'RESIST','#7fc8ff');}
  if(opt.melee&&e.type==='crawler')amt*=.6;
  if(S.mode==='monster'&&S.night)amt*=1.3;
  if(e.vulnT>0)amt*=1.6;
  if(e.boss&&!e.awake)wakeBoss(e);
  e.hp-=amt;if(!opt.dot)e.flash=.1;
  if(!opt.dot){
    if(e.kind==='monster'&&e.state!=='chase'&&!S.P.dead&&e.sc===S.P.sc&&!(e.charmT>0))e.state='chase';
    if(e.kind==='human')e.alert=4;
    if(S.P.buffs.lifesteal>0)healPlayer(amt*.15,true);
    else if(opt.melee&&hasTrait('lifesteal'))healPlayer(amt*.12,true);
  }
  if(opt.st)applyStatus(e,opt.st,opt.m||1,opt.stunT);
  if(opt.mods){if(opt.mods.includes('vamp'))healPlayer(amt*.15,true);if(opt.mods.includes('burn'))applyStatus(e,'burn',1);if(opt.mods.includes('chill'))applyStatus(e,'slow',1);if(opt.mods.includes('shock'))applyStatus(e,'stun',1,.4);}
  if(!quiet)floatText(e.x+rnd(-8,8),e.y-e.r-6,Math.round(amt),src&&POWERS[src]?POWERS[src].color:'#fff');
  if(!opt.dot&&!quiet)sfx('hit');
  if(e.hp<=0)killEnemy(e);
}
function dmgStructures(x,y,r,amt){
  if(S.mode!=='monster'||!amt)return;

    const cx=clamp(x,b.x-14,b.x+b.w+14),cy=clamp(y,b.y-14,b.y+b.h+14);
    if(Math.hypot(x-cx,y-cy)<r){b.hp-=amt;b.flash=.1;if(b.hp<=0)outpostFall(b);}}
}
function killEnemy(e){
  if(e.dead)return;e.dead=true;burst(e.x,e.y,e.color,16);sfx(e.boss?'boss':'kill');
  e.stolen.forEach(returnStolen);e.stolen=[];

    S.stats.kills++;const d=MONSTERS[e.type];
    if(e.mut==='Volatile'){addFx({type:'shock',x:e.x,y:e.y,r:90,life:.4,color:'#ff4d5e'});if(!S.P.dead&&e.sc===S.P.sc&&dist(e,S.P)<90)damagePlayer(18,null);}
    if(d.mimic&&S.mode==='hunter')mimicReward(e);
    if(S.mode==='hunter'&&!e.boss&&d.genes&&d.genes.length&&(!d.minion||Math.random()<.4)){dropStrand(e);if(e.mut&&Math.random()<.5)dropStrand(e);}
    if(S.mode==='hunter'&&Math.random()<.3&&!e.boss){const k=pick(['food','scrap','wood','ammo']);const n=k==='ammo'?3:1;S.res[k]+=n;floatText(e.x,e.y-36,'+'+n+' '+RES_ICON[k],'#ffd166');}

    if(e.boss)bossDefeated();
  }else{
    S.stats.humans++;S.biomass+=e.bio;S.fear=Math.min(100,S.fear+1.5);if(S.mode==='hunter')humanityHit(3);

  }
}
// ================= DNA STRANDS & VAULT =================
const QUAL={rough:{name:'Rough',col:'#b8a890',min:5,max:8},clean:{name:'Clean',col:'#7fd6ff',min:12,max:18},pure:{name:'Pure',col:'#ffd166',min:26,max:34}};
function rollGene(genes){const w=[.6,.28,.12];let r=Math.random()*w.slice(0,genes.length).reduce((a,b)=>a+b,0);for(let i=0;i<genes.length;i++){r-=w[i];if(r<=0)return genes[i];}return genes[0];}
function rollQuality(){const bonus=(S.night?.08:0)+(S.bloodMoon&&S.night?.1:0)+(hasTrait('glow')?.1:0)+(S.tier>=2?.08:0);const r=Math.random();return r<.08+bonus*.6?'pure':r<.4+bonus?'clean':'rough';}
function dropStrand(e,gene,q){
  const d=MONSTERS[e.type];gene=gene||rollGene(d.genes);q=q||rollQuality();

function vaultCap(){return 10+S.tier*2;}
function addToVault(pk){
  const g=geneInfo(pk.gene),Q=QUAL[pk.q];

}
function updatePickups(dt){
  const P=S.P;
  S.pickups.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;
    if(P.dead||p.sc!==P.sc||S.mode!=='hunter')return;const d=dist(p,P);

function mimicReward(e){

function addDNA(id,amt,src){

function playerAttack(){

  if(hunter&&W.ranged){

    S.res.ammo--;P.atkCd=W.cd;P.swing=.1;sfx('shot');S.shake=Math.max(S.shake,W.pellets>1?4:1.5);
    for(let i=0;i<W.pellets;i++){const a=P.face+rnd(-W.spread,W.spread),sp=rnd(650,760);
      S.proj.push({x:P.x+Math.cos(P.face)*20,y:P.y+Math.sin(P.face)*20,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:3,dmg:W.dmg*fr,owner:'p',life:W.range/sp,color:'#ffe08a',bullet:true,sc:P.sc});}
    addFx({type:'p',x:P.x+Math.cos(P.face)*26,y:P.y+Math.sin(P.face)*26,vx:0,vy:0,life:.08,color:'#fff4b0',r:9});

  if(!hunter)dmgStructures(P.x+Math.cos(a)*42,P.y+Math.sin(a)*42,55,dmg);

function breakProps(range,a,arc,dmg){
  const P=S.P,I=S.interiors[P.sc];if(!I)return;

      p.hp-=dmg;p.flash=.12;burst(c.x,c.y,PROPS[p.type].col,4);

        for(const k in D)got[k]=irnd(D[k][0],D[k][1]);burst(c.x,c.y,PROPS[p.type].col,14);
        const parts=giveRes(got,c.x,c.y-10);if(!parts.length)floatText(c.x,c.y-10,'nothing useful','#999');}

}
function playerDown(src){

  P.dead=true;P.hp=0;P.respawnT=4;P.dashT=0;P.invisT=0;P.armorT=0;P.leap=null;P.rollT=0;P.buffs={};burst(P.x,P.y,S.mode==='hunter'?'#ff4d5e':'#c27bff',24);

  }else{

}

  const cam=getCam();

  else if(ml)P.face=Math.atan2(my,mx);
  if(P.rollT>0){P.rollT-=dt;P.rollTick-=dt;if(P.rollTick<=0){P.rollTick=.26;const f=P.rollF||{r:100,dmg:14,knock:30},R=f.r*(P.rollArea||1);
    S.enemies.forEach(e=>{if(!e.dead&&e.sc===P.sc&&dist(e,P)<R+e.r){dmgFoe(e,f.dmg*P.rollM,P.rollSrc,false,{mods:P.rollMods});const d=dist(e,P)||1;if(!e.boss&&e.type!=='house'){e.x+=(e.x-P.x)/d*(f.knock||30);e.y+=(e.y-P.y)/d*(f.knock||30);}}});
    dmgStructures(P.x,P.y,R,f.dmg*P.rollM);addFx({type:'shock',x:P.x,y:P.y,r:R,life:.25,color:'#8fd060'});}}
  if(P.leap){const L=P.leap;L.t+=dt;const k=Math.min(1,L.t/L.dur);P.x=L.sx+(L.tx-L.sx)*k;P.y=L.sy+(L.ty-L.sy)*k;
    if(k>=1){P.leap=null;const f=L.f||{r:95,dmg:30,st:'stun'},R=f.r*(L.area||1);S.enemies.forEach(e=>{if(!e.dead&&e.sc===P.sc&&dist(e,P)<R+e.r)dmgFoe(e,f.dmg*L.m,L.src,false,{st:f.st,m:L.m,mods:L.mods,stunT:.6});});
      dmgStructures(P.x,P.y,R,f.dmg*L.m);addFx({type:'shock',x:P.x,y:P.y,r:R,life:.4,color:POWERS[L.src]?POWERS[L.src].color:'#c6d94a'});S.shake=7;pushOut(P,solidsFor(P.sc));}
    return;}
  if(P.dashT>0){
    const f=P.dashFx||{};P.dashT-=dt;P.x+=P.dashVx*dt;P.y+=P.dashVy*dt;P.trail-=dt;
    if(f.trail&&P.trail<=0){P.trail=.035;S.hazards.push({x:P.x,y:P.y,r:26,life:2.6,max:2.6,dps:f.trail.dps*P.dashM,owner:'p',color:'#ff7a2f',src:P.dashSrc,kind:'fire',st:f.trail.st,sc:P.sc,m:P.dashM,tick:0});}
    S.enemies.forEach(e=>{if(!e.dead&&e.sc===P.sc&&!P.dashHit.includes(e)&&dist(e,P)<P.r+e.r+8){P.dashHit.push(e);dmgFoe(e,(f.hit||14)*P.dashM,P.dashSrc,false,{st:f.st,m:P.dashM,mods:P.dashMods});}});

  const P=S.P;P.r=20;P.dead=false;P.armorT=0;P.invisT=0;P.stunT=0;P.rootT=0;P.car=null;P.hidden=null;teleport(P,BASE.x,BASE.y+70,'out');P.hp=maxHp();
  const T=TOWNS[S.town];
  if(T.arena){const w=spawnMonster(T.boss,1200,360,{sc:'out'});w.hx=1200;w.hy=360;return;}
  S.camps.forEach(c=>{if(!c.raided)makeCampHostile(c);});
  S.blds.forEach(b=>{if(T.outposts.includes(b.id)){b.outpost=true;b.awake=false;b.maxHp=240;b.hp=240;b.fallen=false;b.spawnT=rnd(3,6);
    spawnHuman('scav',b.lx,b.ly,b);spawnHuman(Math.random()<.5?'hunter':'trapper',b.lx,b.ly,b);
    const I=S.interiors[b.id];if(I){const cap=spawnHuman('hunter',I.x+I.w/2,I.y+140,b,{sc:b.id});cap.captain=true;cap.hp*=2.2;cap.maxHp=cap.hp;cap.r=15;cap.name='Outpost Captain';
      for(let k=0;k<2;k++){const h=spawnHuman(pick(['hunter','torch','scav']),I.x+rnd(120,I.w-120),I.y+rnd(120,I.h-160),b,{sc:b.id});}}}});
}
function pollAutosave(dt){S.saveT=(S.saveT||0)+dt;if(S.saveT>60){S.saveT=0;saveGame(true);}}
// ================= MAIN UPDATE =================
function update(dt){
  S._sol={};
  S.t+=dt;if(S.shake>0)S.shake=Math.max(0,S.shake-dt*20);if(S.fade>0)S.fade-=dt;
  updateClock(dt);updatePlayer(dt);updateHold(dt);updateFollowers(dt);updatePickups(dt);updateCamps(dt);updateCrew(dt);
  S.echoQ=S.echoQ.filter(q=>{q.t-=dt;if(q.t<=0){if(!S.P.dead&&level(q.id))castPower(q.id,.5,true);return false;}return true;});
  for(const id in S.cds)S.cds[id]=Math.max(0,S.cds[id]-dt);
  for(const c of S.cars)c.flash-=dt;
  S.windows.forEach(w=>w.flash-=dt);
  for(const e of S.enemies){if(e.dead)continue;if(e.kind==='monster')updateMonster(e,dt);else updateHuman(e,dt);}
  separate();updateAllies(dt);
  if(S.mode==='hunter')updateTurrets(dt);
  updateProj(dt);updateHazards(dt);
  S.enemies=S.enemies.filter(e=>!e.dead);S.allies=S.allies.filter(a=>!a.dead);
  S.fx.forEach(f=>{f.life-=dt;if(f.type==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;}});S.fx=S.fx.filter(f=>f.life>0);
  S.floats.forEach(f=>{f.life-=dt;f.y-=30*dt;});S.floats=S.floats.filter(f=>f.life>0);
  if(S.banners.length){S.banners[0].life-=dt;if(S.banners[0].life<=0)S.banners.shift();}
  if(S.mode==='monster'){updateOutposts(dt);S.fear=Math.max(0,S.fear-dt*.15);}
  if(S.rivalT>0){S.rivalT-=dt;if(S.rivalT<=0){S.rivalT=0;if(!S.rival&&!S.rivalDone)spawnRival();}}
  if(S.pendingStory>0&&S.mode==='hunter'&&!S.pendingTurn){S.pendingStory-=dt;if(S.pendingStory<=0)afterBossStory();}
  if(S.pendingVance&&!ovMode){S.pendingVance=0;showChoice('vance');}
  updateVance(dt);pollAutosave(dt);
  if(S.pendingTurn>0&&S.mode==='hunter'){S.pendingTurn-=dt;if(S.pendingTurn<=0)showTurnStory();}
  if(S.pendingWin>0){S.pendingWin-=dt;if(S.pendingWin<=0)winGame();}
  if(S.pendingState>0){S.pendingState-=dt;if(S.pendingState<=0)showStateCard();}
}

/* standing: replaced later */
function wTier(c){const s=standing(c);return TIERS_W.find(t=>s>=t.min);}
function makeCamps(){
  const T=TOWNS[S.town];if(T.arena)return [];const names=T.campNames||CAMP_NAMES[{Millbrook:0,Saltmarsh:1,Frostfall:2,Dustbowl:3,'Old Haven':4}[T.name]||0],out=[];
  for(let i=0;i<2;i++){
    for(let k=0;k<400;k++){
      const x=rnd(180,WW-180),y=rnd(180,WH-180);
      if(Math.hypot(x-BASE.x,y-BASE.y)<420)continue;
      if(S.blds.some(b=>rectDist({x,y},{x:b.x-30,y:b.y-30,w:b.w+60,h:b.h+60})<150))continue;
      if(nearRoad(x,y,S.roads?70:150))continue;if(S.blds.some(b=>b.boss&&Math.hypot(b.x+b.w/2-x,b.y+b.h/2-y)<650))continue;if(out.some(o=>Math.hypot(o.x-x,o.y-y)<600))continue;
      const N=names[i];
      const c={id:'camp'+i,name:N.name,leader:N.leader,x,y,r:120,rep:0,tested:false,raided:false,hostile:false,visited:false,tribute:true,rumorDay:-1,
        offers:makeOffers(),jobs:[],recruits:[],guards:[0,1,2].map(g=>({a:g*2.1+.5,cd:rnd(0,1),aim:0})),npcs:[]};
      c.recruits=[0,1].map(()=>({name:pick(NPC_NAMES),role:pick(Object.keys(ROLES))}));
      for(let j=0;j<3;j++)c.jobs.push(makeJob(c));
      out.push(c);break;
    }
  }
  decor=decor.filter(d=>!out.some(c=>Math.hypot(d.x-c.x,d.y-c.y)<c.r+30));
  S.cars=S.cars.filter(car=>!out.some(c=>Math.hypot(car.x-c.x,car.y-c.y)<c.r+50));
  return out;
}
function makeOffers(){
  const all=[[{wood:3},{meds:2}],[{scrap:2},{ammo:5}],[{food:3},{fuel:1}],[{wire:2},{mutagen:1}],[{scrap:4},{wire:2}],[{meds:2},{food:3}],[{fuel:1},{scrap:3}],[{food:2},{wood:3}]];
  return all.sort(()=>Math.random()-.5).slice(0,5).map(([give,get])=>({give,get,stock:2}));
}
function makeJob(c){
  const r=Math.random(),cand=S.blds.filter(b=>!b.boss&&!b.mimicBld&&b.monster);
  if(r<.35&&cand.length){const b=pick(cand);return {type:'kill',bld:b.id,text:'Kill the '+MONSTERS[b.monster].name+' living in the '+b.name+'.',rew:rollReward(),rep:20,camp:c.id,state:'open'};}
  if(r<.6){const k=pick(['food','wood','scrap','meds']),n=k==='meds'?2:irnd(3,5);return {type:'fetch',res:k,n,text:'Bring '+n+' '+k+' to the camp.',rew:rollReward(),rep:15,camp:c.id,state:'open'};}
  if(r<.8&&cand.length){const b=pick(cand);return {type:'rescue',bld:b.id,who:pick(NPC_NAMES),text:'',rew:rollReward(),rep:25,camp:c.id,state:'open'};}
  const n=irnd(4,7);return {type:'hunt',n,got:0,text:'Kill '+n+' monsters anywhere in town.',rew:rollReward(),rep:15,camp:c.id,state:'open'};
}
function rollReward(){const r=rollTable({meds:2,ammo:2,food:2,wire:1,fuel:1,mutagen:1},2);if(Math.random()<.2)r.key=1;return r;}
function rewardText(r){return Object.keys(r).map(k=>k==='key'?'🔑 car keys':(r[k]+' '+RES_ICON[k])).join(' + ');}
function jobText(j){return j.type==='rescue'?'Find '+j.who+', who went into the '+S.blds.find(b=>b.id===j.bld).name+' and never came back.':j.type==='hunt'?j.text+' ('+j.got+'/'+j.n+')':j.text;}
function campOf(id){return S.camps.find(c=>c.id===id);}
function nearCamp(){const P=S.P;if(P.sc!=='out')return null;return S.camps.find(c=>!c.raided&&Math.hypot(P.x-c.x,P.y-c.y)<c.r)||null;}
function activeJobs(){return S.jobs.filter(j=>j.state==='active'||j.state==='done');}
function acceptJob(c,i){
  const j=c.jobs[i];if(!j||activeJobs().length>=3)return;j.state='active';S.jobs.push(j);
  if(j.type==='rescue'){const I=S.interiors[j.bld];if(I){const p=I.props.find(q=>!q.dead)||{x:I.x+I.w/2,y:I.y+I.h/2,w:0,h:0};
    S.lost.push({x:clamp(I.x+I.w*.75,I.x+60,I.x+I.w-60),y:I.y+I.h*.35,sc:j.bld,name:j.who,job:j,found:false});}}
  toast('Job accepted: '+jobText(j),'good');
}
function completeJob(j){
  const c=campOf(j.camp);j.state='paid';{const L=tlog();if(c&&!L.campsHelped.includes(c.id))L.campsHelped.push(c.id);}S.jobs=S.jobs.filter(x=>x!==j);if(c){c.jobs=c.jobs.filter(x=>x!==j);c.jobs.push(makeJob(c));c.rep=Math.min(60,c.rep+j.rep);}
  S.path.hunter+=.5;const r={...j.rew};const key=r.key;delete r.key;const parts=giveRes(r,S.P.x,S.P.y-30);if(key)giveKey();
  banner('JOB DONE',(c?c.leader+' pays you: ':'')+(parts.join(', ')||'thanks')+(key?' and a set of car keys':'')+'. They trust you more.','#7dff9a');
  if(j.type==='rescue'&&c&&c.recruits.length<3){c.recruits.push({name:j.who,role:pick(Object.keys(ROLES))});toast(j.who+' wants to join your crew. Talk to '+c.leader+'.','good');}
}
function jobOnKill(e){
  S.jobs.forEach(j=>{if(j.state!=='active')return;
    if(j.type==='kill'&&e.home&&e.home.id===j.bld){j.state='done';toast('Job ready: go back to '+campOf(j.camp).name+' to get paid.','good');}
    if(j.type==='hunt'&&e.kind==='monster'){j.got++;if(j.got>=j.n){j.state='done';toast('Job ready: go back to '+campOf(j.camp).name+' to get paid.','good');}}});
  if(e.kind==='monster')S.camps.forEach(c=>{if(!c.raided&&!c.hostile&&Math.hypot(e.x-c.x,e.y-c.y)<c.r+200&&e.sc==='out'){c.rep=Math.min(60,c.rep+2);}});
  if(e.campId){const c=campOf(e.campId);if(c&&!c.raided&&!S.enemies.some(x=>!x.dead&&x.campId===c.id))raidCamp(c,true);}
}
function raidCamp(c,fought){
  c.raided=true;c.hostile=false;{const L=tlog();if(!L.campsRaided.includes(c.id))L.campsRaided.push(c.id);}
  const parts=giveRes(rollTable({food:3,meds:2,ammo:2,scrap:2,wood:2,fuel:1,wire:1,mutagen:1},S.mode==='monster'?4:7),c.x,c.y-30);
  if(S.mode==='monster'){S.biomass+=20;S.fear=Math.min(100,S.fear+12);banner(c.name.toUpperCase()+' RAIDED','+20 biomass. The survivors who lived scatter into the swamp and fields.','#c27bff');}
  else{humanityHit(fought?6:10);S.path.apex+=1;banner(c.name.toUpperCase()+' RAIDED','You took everything: '+parts.join(', ')+'. Word will spread.','#ff5a68');
    S.camps.forEach(o=>{if(o!==c)o.rep=Math.max(-60,o.rep-25);});}
  S.jobs=S.jobs.filter(j=>j.camp!==c.id);S.lost=S.lost.filter(l=>l.job.camp!==c.id);
}
function makeCampHostile(c){
  if(c.hostile||c.raided)return;c.hostile=true;
  c.guards.forEach(g=>{const h=spawnHuman('hunter',c.x+Math.cos(g.a)*c.r*.8,c.y+Math.sin(g.a)*c.r*.8,null);h.campId=c.id;h.alert=99;h.hx=c.x;h.hy=c.y;});
  for(let i=0;i<2;i++){const h=spawnHuman(i?'torch':'trapper',c.x+rnd(-40,40),c.y+rnd(-40,40),null);h.campId=c.id;h.alert=99;h.hx=c.x;h.hy=c.y;}
  banner(c.name.toUpperCase()+' OPENS FIRE',S.mode==='monster'?'Break their camp.':'They see a monster now. Fight, flee, or hide.','#ff5a68');
}
function updateCamps(dt){
  const P=S.P;
  S.camps.forEach(c=>{if(c.raided)return;
    const d=Math.hypot(P.x-c.x,P.y-c.y),T=wTier(c);
    if(S.mode==='hunter'&&!c.hostile&&P.sc==='out'&&!P.dead){
      if(d<c.r+40&&!c.visited){c.visited=true;vanceCampHook(c);banner(c.name.toUpperCase(),'Survivors! '+c.leader+' runs this camp. Walk up and press E to talk. They see you as '+T.name+'.',T.col);}
      if(T.name==='HOSTILE'&&d<300&&P.invisT<=0&&!P.hidden)makeCampHostile(c);
    }
    if(!c.hostile&&S.mode==='hunter')c.guards.forEach(g=>{g.cd-=dt;const gx=c.x+Math.cos(g.a)*c.r*.85,gy=c.y+Math.sin(g.a)*c.r*.85;
      const e=nearestFoe({x:gx,y:gy,sc:'out'},270);if(e&&e.kind==='monster'&&!e.boss){g.aim=Math.atan2(e.y-gy,e.x-gx);if(g.cd<=0){g.cd=1.3;S.proj.push({x:gx,y:gy,vx:Math.cos(g.aim)*560,vy:Math.sin(g.aim)*560,r:3,dmg:8,owner:'p',life:.6,color:'#ffe08a',sc:'out',turret:true,bullet:true});}}});
  });
  // rescue NPCs
  S.lost.forEach(l=>{if(l.found)return;if(P.sc===l.sc&&dist(P,l)<40){l.found=true;l.job.state='done';banner(l.name.toUpperCase()+' FOUND','"Thank you! I\'ll run back to camp." Go back to '+campOf(l.job.camp).name+' to finish the job.','#7dff9a');}});
  S.lost=S.lost.filter(l=>!l.found);
}
// ---------- crew ----------
function crewHas(role){return S.crew.some(m=>m.role===role&&!m.dead);}
function updateCrew(dt){
  const B=S.baseInt;if(!B)return;
  S.crew.forEach(m=>{if(m.dead)return;if(m.hp!==undefined&&m.hp<=0){m.dead=true;banner(m.name.toUpperCase()+' IS DEAD','Something got inside and your '+ROLES[m.role].name.toLowerCase()+' didn\'t make it.','#ff5a68');return;}if(m.x===undefined||!inRect(m.x,m.y,B)){m.x=B.x+rnd(120,B.w-120);m.y=B.y+rnd(140,B.h-120);m.sc='base';m.hp=40;m.r=11;}
    m.wT=(m.wT||0)-dt;if(m.wT<=0){m.wT=rnd(2,5);m.tx=B.x+rnd(100,B.w-100);m.ty=B.y+rnd(120,B.h-100);}
    const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy);if(d>4){m.x+=dx/d*40*dt;m.y+=dy/d*40*dt;m.fa=Math.atan2(dy,dx);}
    pushOut(m,solidsFor('base'));
    if(m.role==='guard'){m.cd=(m.cd||0)-dt;const e=nearestFoe({x:m.x,y:m.y,sc:'base'},300);if(e&&m.cd<=0){m.cd=1.1;const a=Math.atan2(e.y-m.y,e.x-m.x);m.fa=a;S.proj.push({x:m.x,y:m.y,vx:Math.cos(a)*560,vy:Math.sin(a)*560,r:3,dmg:9,owner:'p',life:.6,color:'#ffe08a',sc:'base',bullet:true});}}
  });
  if(S.mode==='hunter'){
    if(crewHas('mechanic')){S.baseHp=Math.min(baseMax(),S.baseHp+2*dt);S.windows.forEach(w=>{if(w.hp>0)w.hp=Math.min(winMax(),w.hp+3*dt);});}
    if(crewHas('medic')&&S.P.sc==='base'&&!S.P.dead)S.P.hp=Math.min(maxHp(),S.P.hp+4*dt);
  }
}
function crewDawn(){
  if(S.mode!=='hunter')return;
  const gone=[];
  S.crew.forEach(m=>{if(m.dead)return;
    if(S.humanity<30&&Math.random()<.5){m.dead=true;m.left=true;gone.push(m);return;}
    if(m.role==='medic'){S.res.meds++;}
    if(m.role==='cook'){S.res.food++;}
    if(m.role==='scavenger'){const k1=pick(['wood','scrap','wire','food','ammo']),k2=pick(['wood','scrap','food','meds']);S.res[k1]++;S.res[k2]++;}});
  if(gone.length)toast(gone.map(m=>m.name+' the '+ROLES[m.role].name).join(' and ')+(gone.length>1?' left':' left')+' in the night. They said they saw what you\'re turning into.','bad');
  const made=[];if(crewHas('medic'))made.push('+1 meds');if(crewHas('cook'))made.push('+1 food');if(crewHas('scavenger'))made.push('+2 supplies');
  if(made.length)toast('Your crew got to work: '+made.join(', ')+'.','good');
  S.crew=S.crew.filter(m=>!m.dead);
  S.camps.forEach(c=>{c.offers.forEach(o=>o.stock=2);c.tribute=true;});
}

function drawShape(m,c,r,t){
  switch(MONSTERS[m.type].shape){
    case 'copy':{ctx.globalAlpha*=.7+.25*Math.sin(t*9);const o=Math.sin(t*20)*2;circ(-r*.15+o,0,r,c,3);for(const s of [-1,1])circ(r*.45,s*r*.85,r*.32,c,2);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-r*.15-o*2,0,r+3,0,7);ctx.stroke();ctx.globalAlpha=m.alpha;break;}
    case 'brute':circ(-r*.2,0,r,c,3);circ(r*.55,0,r*.5,shade(m.color,-.1),2.5);for(const s of [-1,1])circ(r*.3,s*r*.95,r*.35,shade(m.color,-.15),2);break;
    case 'wraith':ctx.globalAlpha*=.85;ctx.beginPath();ctx.moveTo(r*1.2,0);for(let i=0;i<=8;i++){const a=Math.PI*.5+i/8*Math.PI;ctx.lineTo(Math.cos(a)*r*(1+(i%2)*.35)-r*.2,Math.sin(a)*r);}ctx.closePath();fs(c);ctx.globalAlpha=m.alpha;break;
    case 'quad':for(const s of [-1,1])for(const o of [-.5,.5]){ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(o*r,s*r*.4);ctx.lineTo(o*r+Math.sin(t*12+o)*4,s*r*1.05);ctx.stroke();}
      ctx.beginPath();ctx.ellipse(-2,0,r*1.2,r*.62,0,0,7);fs(c);circ(r*.95,0,r*.5,c,2.5);ctx.beginPath();ctx.moveTo(-r*1.1,0);ctx.lineTo(-r*1.7,Math.sin(t*8)*5);ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.stroke();break;
    case 'bird':{const f=Math.sin(t*12)*.4;ctx.beginPath();ctx.moveTo(r*1.2,0);ctx.lineTo(-r*.6,-r*(1.7+f));ctx.lineTo(-r*.2,0);ctx.lineTo(-r*.6,r*(1.7+f));ctx.closePath();fs(c);circ(r*.7,0,r*.45,shade(m.color,-.1),2);break;}
    case 'bug':for(let i=0;i<3;i++)for(const s of [-1,1]){ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo((i-1)*r*.5,s*r*.4);ctx.lineTo((i-1)*r*.6+Math.sin(t*14+i)*3,s*r*1.2);ctx.stroke();}
      ctx.beginPath();ctx.ellipse(0,0,r*1.1,r*.75,0,0,7);fs(c);ctx.strokeStyle=shade(m.color,-.3);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r*.6,0);ctx.stroke();circ(r*.9,0,r*.4,shade(m.color,-.15),2);break;
    case 'serpent':for(let i=4;i>=0;i--){const x=-i*r*.55,y=Math.sin(t*6+i)*r*.35;circ(x,y,r*(1-i*.12),i?shade(m.color,-.06*i):c,2.5);}break;
    case 'golem':box(-r,-r*.85,r*2,r*1.7,c,6,3);ctx.fillStyle=shade(m.color,-.25);for(let i=0;i<3;i++)ctx.fillRect(-r*.8+i*r*.6,-r*.6,r*.35,r*1.2);for(const s of [-1,1])box(r*.1,s*r*1.05-r*.25,r*.7,r*.5,shade(m.color,.1),4,2);break;
    case 'blob':ctx.beginPath();for(let i=0;i<12;i++){const a=i/12*6.28,rr=r*(1+.1*Math.sin(t*4+i*1.3));ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();fs(c);circ(-r*.2,-r*.2,r*.35,shade(m.color,.15),0);break;
    case 'spiky':for(let i=0;i<10;i++){const a=i/10*6.28;ctx.beginPath();ctx.moveTo(Math.cos(a-.2)*r*.8,Math.sin(a-.2)*r*.8);ctx.lineTo(Math.cos(a)*r*1.5,Math.sin(a)*r*1.5);ctx.lineTo(Math.cos(a+.2)*r*.8,Math.sin(a+.2)*r*.8);fs(shade(m.color,.1),1.5);}circ(0,0,r,c,2.5);break;
    case 'boss':{const pz=Math.sin(t*1.6)*4;ctx.strokeStyle=shade(m.color,-.2);ctx.lineWidth=9;for(let i=0;i<8;i++){const a=i/8*6.28+Math.sin(t+i)*.2;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(Math.cos(a+.3)*r,Math.sin(a+.3)*r,Math.cos(a)*(r+28),Math.sin(a)*(r+28));ctx.stroke();}
      circ(0,0,r+pz,c,3);circ(0,0,r*.62,shade(m.color,-.35),2);for(let i=0;i<6;i++){const a=-1+i*.4;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.75,Math.sin(a)*r*.75);ctx.lineTo(Math.cos(a)*r*1.2,Math.sin(a)*r*1.2);ctx.lineTo(Math.cos(a+.14)*r*.75,Math.sin(a+.14)*r*.75);fs('#f0ece0',1.5);}
      ctx.fillStyle=m.eye;ctx.shadowColor=m.eye;ctx.shadowBlur=16;ctx.beginPath();ctx.arc(r*.38,-12,6,0,7);ctx.arc(r*.38,12,6,0,7);ctx.fill();ctx.shadowBlur=0;break;}
    case 'warden':{ctx.rotate(-m.fa);const pz=Math.sin(t*2)*3;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(0,0,r*1.4,0,7);ctx.fill();
      for(let i=0;i<12;i++){const a=i/12*6.28+t*.3;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.9,Math.sin(a)*r*.9);ctx.lineTo(Math.cos(a+.1)*(r*1.45+pz),Math.sin(a+.1)*(r*1.45+pz));ctx.lineTo(Math.cos(a+.2)*r*.9,Math.sin(a+.2)*r*.9);fs(m.phase===3?'#ff3b3b':shade(m.color,.3),2);}
      circ(0,0,r,c,4);circ(0,0,r*.7,shade(m.color,-.3),3);
      const cols=Object.values(FAM).map(f=>f.color);for(let i=0;i<6;i++){const a=i/6*6.28-t*.8;circ(Math.cos(a)*r*.5,Math.sin(a)*r*.5,6,cols[(i*2)%cols.length],1.5);}
      ctx.fillStyle=m.eye;ctx.shadowColor=m.eye;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(0,-8,9,0,7);ctx.fill();ctx.shadowBlur=0;circ(0,-8,4,'#000',0);break;}
    default:circ(0,0,r,c,2.5);

}

function pathScores(){const p=S.path,h=S.humanity,hyb=Object.keys(S.dna).filter(id=>POWERS[id]&&POWERS[id].hybrid&&S.dna[id]>0).length;
  return {Hunter:p.hunter+(h-50)/12,Apex:p.apex+(50-h)/12+(S.mode==='monster'?6:0),Splicer:p.splicer+hyb*.6+(S.choices.vance==='ally'&&!S.vanceGone?2:0)};}
function pathName(){if(S.mode==='monster')return 'Apex';const s=pathScores();return Object.keys(s).sort((a,b)=>s[b]-s[a])[0];}

    else if(o==='refuse'){P.hunter+=1;toast('"Suit yourself." Vance disappears into the reeds.');}
    else{P.apex+=2;spawnRival();S.rival.hunterDuel=true;}

function spawnVance(){S.vance={x:S.P.x+30,y:S.P.y,sc:S.P.sc,r:15,hp:220,maxHp:220,cd:0,cd2:3,fa:0,down:0};}
function updateVance(dt){
  const V=S.vance,P=S.P;if(!V)return;
  if(S.mode==='monster'&&pathName()!=='Splicer'&&!V.stays){S.vance=null;S.vanceGone=true;toast('Vance looks at what you\'ve become for a long time. Then he walks away.','bad');return;}
  if(V.down>0){V.down-=dt;if(V.down<=0){V.hp=V.maxHp;teleport(V,P.x+30,P.y,P.sc);toast('Vance is back on his feet.','good');}return;}
  if(V.sc!==P.sc||dist(V,P)>700){teleport(V,P.x+rnd(-30,30),P.y+rnd(-30,30),P.sc);}
  V.cd-=dt;V.cd2-=dt;
  const e=nearestFoe(V,360);
  if(e){V.fa=Math.atan2(e.y-V.y,e.x-V.x);
    if(V.cd<=0){V.cd=.8;S.proj.push({x:V.x,y:V.y,vx:Math.cos(V.fa)*560,vy:Math.sin(V.fa)*560,r:5,dmg:13,owner:'p',life:.75,color:'#7fd6ff',sc:V.sc,st:V.freeze?'slow':null});}
    if(V.cd2<=0){V.cd2=6;let cur=V;const hit=[];for(let k=0;k<4;k++){const t=nearestFoe(cur,220,hit);if(!t)break;hit.push(t);addFx({type:'bolt',x:cur.x,y:cur.y,x2:t.x,y2:t.y,life:.25,color:'#7fd6ff'});dmgFoe(t,18,null,false,{st:V.freeze?'freeze':null});cur=t;}
      if(V.wave){S.proj.push({x:V.x,y:V.y,vx:Math.cos(V.fa)*380,vy:Math.sin(V.fa)*380,r:50,dmg:25,owner:'p',life:1,color:'#5fd3e8',pierce:true,hit:[],wave:true,knock:.15,sc:V.sc});}}}
  const tx=P.x-Math.cos(P.face)*50,ty=P.y-Math.sin(P.face)*50,d=Math.hypot(tx-V.x,ty-V.y);
  if(d>30){V.x+=(tx-V.x)/d*Math.min(d*3,220)*dt;V.y+=(ty-V.y)/d*Math.min(d*3,220)*dt;if(!e)V.fa=Math.atan2(ty-V.y,tx-V.x);}
  pushOut(V,solidsFor(V.sc));
  S.enemies.forEach(m=>{if(!m.dead&&m.kind==='monster'&&m.sc===V.sc&&dist(m,V)<m.r+V.r+6&&m.atkCd>.8&&Math.random()<dt*.6){V.hp-=m.dmg;if(V.hp<=0){V.down=30;toast('Vance is down! He\'ll get back up in 30 seconds.','bad');}}});
}

let tbEl=null;
function updateToolbar(){
  if(!tbEl){tbEl=document.createElement('div');tbEl.id='toolbar';document.body.appendChild(tbEl);
    tbEl.innerHTML=[['menu','☰','Menu','Esc'],['dna','🧬','DNA','Tab'],['map','🗺️','Map','M'],['journal','📖','Goals','J'],['log','📜','Log','L'],['help','❓','Help','F1']].map(([a,i,n,k])=>`<button data-tb="${a}" title="${n} (${k})"><span>${i}</span><b>${n}</b><kbd>${k}</kbd></button>`).join('');

function openHelp(){openPanel('help');}
function helpHtml(){
  const mon=S.mode==='monster',goal=(S.story&&!mon&&nextGoal())||objective();
  const sec=(t,items)=>`<section style="margin-bottom:12px"><h3>${t}</h3><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
  return `<div class="card wide">${head('Help · F1 or ? to close','How to play')}
  <section style="margin:10px 0 12px;border-color:var(--gold)"><h3 style="color:var(--gold)">What to do right now</h3><p style="font-size:20px;margin:0">${goal}</p><p class="mute" style="margin:6px 0 0">The same goal is always shown at the top of the screen. Press J for the full list.</p></section>
  <div class="cols" style="margin-top:0">
  <div>${sec('Exploring',['Walk into a door (yellow ENTER arrow) to go inside. Walk out through the red EXIT mat.','<b>Hold E</b> next to cabinets, fridges, lockers and toolboxes (they glow yellow) to search them.','<b>Attack furniture</b> to smash it for wood, scrap and wire.','Building anything (base upgrades, truck parts, weapons, traps) opens a <b>blueprint</b>: drag the material tiles onto the matching spots to put it together.','Searching is noisy. Whatever lives in the building will come.','Buildings can be <b>dangerous</b>: ☣️ gas leaks, ⚡ live wires, 🕳️ rotten floors, 🥚 egg sacs (smash them from a distance before they hatch) and booby-trapped cupboards. Hover over anything to check it. Risky buildings have better loot. Sometimes a monster jumps out while you search, so keep your weapon ready.'])}
  ${sec('Cars',['<b>Hold E</b> next to a car to search its trunk. Press <b>E</b> again to hide inside.','Inside the car, <b>click the parts of the car</b>: the horn on the steering wheel, the wiper stalk, the light knob, the radio, the door lock, the sun visor, the glove box and under the seat. Hover over anything to see what it does.','Hold <b>Space</b> to stay quiet when something sniffs around.','Find car keys (🔑 on your map) to drive. Running monsters over hurts them.'])}
  ${sec('Your base',['Your base has a Workbench (build upgrades), DNA Lab, Weapon Rack, Stat Board, Bed and Pantry. Stand next to one and press <b>E</b>.','At night monsters attack. Inside, stand at a window or the door and press <b>E</b> to <b>look out and fight</b> (you take half damage behind cover). Press <b>R</b> to board up a window with 1 wood. Build spike pits, bear traps and log walls at the workbench. If the base falls, it gets breached: monsters pour in, you lose some supplies and the base drops a level. A breached Rickety Shack becomes a <b>ruin</b> you must rebuild (🪵4 ⚙️3). Late in the day you can also <b>sleep at a friendly survivor camp</b> for food instead of defending.','The game saves every dawn and whenever you walk into your base.'])}</div>
  <div>${sec('DNA & powers',['Killed monsters drop glowing <b>DNA strands</b>. Walk over them to put them in your Vault.','Out in town you can only <b>absorb strands raw</b> (half strength). At the DNA Lab in your cabin you can <b>sequence</b> them by playing a lab test (full strength). There are 10 lab tests, and you get a random one each time.','<b>40%</b> unlocks a weak echo of a power, <b>100%</b> the full power, <b>150%</b> mastery. Put powers on keys <b>1, 2, 3</b>.','Every power costs a little <b>humanity</b>. At 0 humanity, you become the monster.','<b>Two roads:</b> at any camp, give DNA away. <b>💉 Vaccines</b> help them and move you toward <b>The Cure</b>. <b>🧬 Turning</b> survivors or <b>☣️ tainting</b> a camp\'s water builds <b>The Brood</b>. At your lab you can <b>⏪ reverse splice</b> to win humanity back.','<b>🎚️ Difficulty:</b> Kid mode has no traps in buildings, rare raids, slow hunger and friendlier gate guards. Change it any time in the Menu. <b>📘 Lessons</b> teach one new thing per day for the first 4 days (turn them on or off on the title screen).','<b>🗝️ The story</b> (Story mode): every country has big choices with a 💉 Cure answer, a 🧬 Brood answer, and sometimes a 🤝 Vance answer. Your two road meters decide the ending. The Goals journal (J) keeps track of what you\'ve learned.','<b>📻 Camp raids:</b> at night monsters attack camps. They smash the gate, get inside and bite people. Help a camp hold its wall for trust and humanity. Bitten survivors (🤒) turn into monsters in 2 days: treat them (1 💊), cure them (needs vaccine know-how), or finish the change and make them yours. If a camp\'s health hits 0, it falls.','<b>🐾 Your pack (C):</b> on the monster road (Brood 1+ or humanity under 50), press C near monsters to make them follow you. Press C near a camp to send them at it. If the camp sees you do it, they will hate you. If your pack takes a camp, you get its loot and Brood +2. The pack scatters at dawn.','<b>🛑 Camp gates:</b> guards stop you at the gate. Human ways in: let them search you (fewer body changes and an empty vault help), show your vaccine work, or pay a toll. Trusted friends get waved through. Monster ways in: stare them down, use a Mind power, turn the gatekeeper at night (the gate then opens for you every night and the searchlights look away), or break in. As the Apex you smash the gate.','<b>Two roads</b> (at any camp): 💉 give a strand to their medic as a <b>vaccine</b> (more trust, and those monsters get sick near the camp). Every new kind of strand moves <b>The Cure</b> forward. Or 🧬 <b>spread it</b>: turn a recruit into a loyal mutant, or sneak to a camp\'s 💧 water tank at night and hold E to taint it. It takes <b>3 doses on 3 different nights</b> (2 strands each). Camps have walls, guards and 🔦 searchlights, and if they catch you at the tank they attack. A camp that notices people getting sick goes on alert. 3 doses make it a <b>Brood camp</b>, and every other camp will hate you for that. With Cure 3+, 3 meds and a strand you can <b>bring a Brood camp back</b>.','<b>⏪ Reverse splice</b> (You tab, at your lab): play a lab test to pull DNA back out of you for humanity. <b>🧥 Disguise</b> hides your changes, unless a camp catches you.','<b>🧍 You tab</b> (in DNA): see your body change with every power family and as humanity drops. <b>Traits</b> come only from certain monsters: fill one to 100% and it is always on.','<b>Absorbing raw</b> gives half the DNA, but it heals you and gives a <b>⚡ Wild Surge</b>: use that power at full strength with <b>F</b> for 30 seconds, even if it\'s still locked. But it\'s risky: sometimes you get a <b>bad batch</b> (fever, glowing, the shakes, or lost humanity), each surge use burns humanity, and when the surge ends you <b>crash</b> (slow and fragile for 8 seconds).'])}
  ${sec('Powers vs traits',['<b>Powers</b> are moves you use: put up to 3 on keys <b>1, 2, 3</b>, press the key to fire it, then wait for the cooldown. Each use costs a little humanity. They unlock at 40% DNA.','<b>Traits</b> are always-on bonuses, like a tougher hide or finding more loot. No button, no cooldown, no humanity cost. They unlock at 100% DNA and you can wear 2.'])}
  ${sec('Survivors',['Camps (⛺ on the minimap) trade, give jobs, share rumors and have recruits.','How they treat you depends on your humanity: Trusted, Uneasy, Wary, Hostile or Feared.','Jobs show at the top of the screen and with a yellow ! on the map.','Camps lose trust if you <b>lead monsters to them</b>, <b>use powers where they can see</b>, or show up <b>glowing</b> from a Wild Surge. Their camp screen shows what they\'ve noticed.'])}
  ${sec('Winning',['Kill a town\'s boss to <b>liberate</b> it. Fix the truck at the <b>Garage</b> 🔧: find 4 tires in car trunks, grab the guarded parts 🔩, charge the battery while monsters attack, pay scrap and wire to fit each part, and add 5 fuel. Then and drive to the next town.','<b>Driving back:</b> the Garage\'s Drive-to list shows every town you\'ve been to. Go back for DNA you\'re missing, to finish a town, to shop at a freed town\'s 🏪 trading post, or to answer a 🆘 radio call. Each town keeps its own base and a stash of what didn\'t fit in the truck. Towns you leave unfinished get more dangerous every day.','Free towns and <b>city districts</b> 🏙️, beat each <b>State Warden</b> 💀 to conquer a state, then beat the <b>country boss</b> 👑 to sail to the next country: the United Wastes → Japan → Scotland → Mexico → Egypt. Beat Apophis in Egypt to win the world. Press <b>M</b> for the map (it has a 🌍 World tab).','You have 3 lives (hearts, top left), and you get one back in each new town. Every time you go down, more monsters come into town. Lose all 3 lives and you wake up in a new shack in the same town: you keep your powers, but everything else gets scavenged, lots more monsters move in, and if you\'d killed the boss, a new stronger boss takes over.'])}</div></div>
  <section><h3>Keys</h3><div class="keys" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <span><kbd>WASD</kbd> move · <kbd>Mouse</kbd> aim</span><span><kbd>Click</kbd>/<kbd>Space</kbd> attack</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> powers</span><span><kbd>E</kbd> use / search (hold)</span>
    <span><kbd>Tab</kbd> DNA</span><span><kbd>M</kbd> map · <kbd>J</kbd> goals · <kbd>L</kbd> log</span><span><kbd>Q</kbd> weapon · <kbd>H</kbd> meds</span><span><kbd>Esc</kbd>/<kbd>P</kbd> menu &amp; save · <kbd>N</kbd> sound</span></div></section></div>`;
}

function ensureTip(){if(tipEl)return;tipEl=document.createElement('div');tipEl.id='tip';document.body.appendChild(tipEl);
  document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[title],[data-tip]');
    if(!el){if(domTip){domTip=false;tipEl.style.display='none';}return;}
    if(el.hasAttribute('title')){const t=el.getAttribute('title');el.removeAttribute('title');if(t)el.dataset.tip=t;}
    if(!el.dataset.tip)return;domTip=true;const tp=el.dataset.tip.split('||');showTip(tp[0],tp[1]||'',e.clientX,e.clientY);});
  document.addEventListener('mousemove',e=>{if(domTip)placeTip(e.clientX,e.clientY);});}
function showTip(t,d,x,y){tipEl.innerHTML=(t?`<b>${t}</b>`:'')+(d?`<span>${d}</span>`:'');tipEl.style.display='block';placeTip(x,y);}
function placeTip(x,y){const r=tipEl.getBoundingClientRect();let tx=x+16,ty=y+18;if(tx+r.width>innerWidth-8)tx=x-r.width-12;if(ty+r.height>innerHeight-8)ty=y-r.height-12;tipEl.style.left=Math.max(8,tx)+'px';tipEl.style.top=Math.max(8,ty)+'px';}
function geneList(type){const g=(MONSTERS[type].genes||[MONSTERS[type].power]).map(id=>geneInfo(id)).filter(Boolean);return g.map(x=>x.icon+' '+x.name).join(', ');}
function worldTip(){
  const P=S.P,cam=getCam(),wx=cam.x+mouse.x/SCALE,wy=cam.y+mouse.y/SCALE,sc=P.sc;
  const e=S.enemies.filter(e=>!e.dead&&e.sc===sc&&Math.hypot(e.x-wx,e.y-wy)<e.r+10).sort((a,b)=>Math.hypot(a.x-wx,a.y-wy)-Math.hypot(b.x-wx,b.y-wy))[0];
  if(e){if(e.kind==='monster'){const M=MONSTERS[e.type];return [e.name+(e.boss?' (boss)':''),'Health '+Math.max(0,Math.round(e.hp))+' / '+Math.round(e.maxHp)+'. Kill it and it may drop DNA for: '+geneList(e.type)+'.'+(e.stolen.length?' It stole your '+e.stolen.map(id=>POWERS[id].name).join(', ')+'! Kill it to get it back.':'')+(M.splits&&!e.split?' Splits in two when hurt.':'')];}
    return [e.name||'Survivor',e.isRival?'The hunter Vance. He can rip powers out of you.':'A human. Health '+Math.round(e.hp)+'.'];}
  const pk=S.pickups.find(p=>p.sc===sc&&Math.hypot(p.x-wx,p.y-wy)<22);
  if(pk){const g=geneInfo(pk.gene);return ['DNA strand: '+g.name,QUAL[pk.q].name+' quality. Walk over it to put it in your vault, then press Tab to use it.'];}
  const al=S.allies.find(a=>a.sc===sc&&Math.hypot(a.x-wx,a.y-wy)<a.r+8);
  if(al)return [al.look==='clone'?'Your copy':'Your ally','Fights on your side for '+Math.ceil(al.life)+' more seconds.'];
  if(sc==='out'){
    const c=S.cars.find(c=>Math.hypot(c.x-wx,c.y-wy)<34);
    if(c){const CT=CARTYPES[c.type];return [c.wreck?'Wrecked car':CT.name,c.wreck?'Too smashed to use. You can still search it.':(c.searched?'Trunk already searched. ':'Hold E next to it to search the trunk. ')+'Press E to hide inside.'+(c.drivable?(S.keys[c.id]?' You have its keys: press E to drive.':' Find its keys to drive it.'):'')];}
    const cp=S.camps.find(c=>Math.hypot(c.x-wx,c.y-wy)<60);
    if(cp)return ['⛺ '+cp.name,cp.raided?'Raided and empty.':cp.hostile?'Hostile. They will shoot at you.':'Survivor camp led by '+cp.leader+'. Walk up and press E to trade, get jobs and hear rumors.'];
    const b=S.blds.find(b=>wx>=b.x&&wx<=b.x+b.w&&wy>=b.y&&wy<=b.y+b.h);
    if(b&&b.garage)return ['🔧 Garage',S.truck&&truckParts().length?'Your broken truck is in here. Truck needs: '+(truckReady()?'nothing! Ready to go.':truckNeed())+'.':'Your truck is in here.'];
    if(b&&S.truck&&Object.keys(S.truck.where).some(k=>S.truck.where[k]===b.id&&S.truck.parts[k]==='missing'))return [b.name,'🔩 A truck part is hidden in here. Look for the glowing blue container.'];
    if(b){if(b.id==='base'||b===BASE)return ['Your base','Walk in the door to use the workbench, DNA lab, bed and more.'];
      const I=S.interiors[b.id],left=I?I.props.filter(p=>!p.dead&&PROPS[p.type].cont&&!p.searched).length:0;
      return [b.name,(b.boss?'The boss lives here. ':'')+'Walk into the door to go inside.'+(I&&I.visited||b.visited?(left?' '+left+' things left to search.':' Searched out.'):'')];}
    if(BASE&&wx>=BASE.x-60&&wx<=BASE.x+60&&wy>=BASE.y-60&&wy<=BASE.y+60)return ['Your base','Walk in the door to use the workbench, DNA lab, bed and more.'];
  }else{
    const I=sceneObj(sc);if(!I)return null;
    const st=(I.stations||[]).find(s=>wx>=s.x&&wx<=s.x+s.w&&wy>=s.y&&wy<=s.y+s.h);if(st)return [st.name,'Stand next to it and press E.'];
    const p=(I.props||[]).find(p=>!p.dead&&wx>=p.x&&wx<=p.x+p.w&&wy>=p.y&&wy<=p.y+p.h);
    if(p&&p.part&&!p.searched)return ['🔩 Truck part inside!','Hold E next to it to grab the '+TPARTS[p.part].name.toLowerCase()+'.'];
    if(p){const D=PROPS[p.type];return [D.name,D.cont?(p.searched?'Already searched.':'Hold E next to it to search it.'):D.brk?'Attack it to smash it for materials.':'Just furniture.'];}
  }
  return null;
}
function updateTips(){
  ensureTip();if(domTip)return;
  if(!S||ovMode||!(S.mode==='hunter'||S.mode==='monster')||performance.now()-mouse.moved>4000){tipEl.style.display='none';return;}
  let h=null;for(let i=HOV.length-1;i>=0;i--){const r=HOV[i];if(mouse.x>=r.x&&mouse.x<=r.x+r.w&&mouse.y>=r.y&&mouse.y<=r.y+r.h){h=[r.t,r.d];break;}}
  if(!h&&!S.P.hidden&&performance.now()-mouse.moved>350&&!mouse.down)h=worldTip();
  if(h)showTip(h[0],h[1],mouse.x,mouse.y);else tipEl.style.display='none';
}

// ================= DNA LAB: 10 SEQUENCING MINIGAMES =================
const BASES=['A','T','G','C'],PAIR={A:'T',T:'A',G:'C',C:'G'},BCOL={A:'#ff5a68',T:'#4aa8ff',G:'#5ad66a',C:'#ffd166',U:'#c27bff'};
const RNA={A:'U',T:'A',G:'C',C:'G'};
const PAIR_RULE=`<span class="pairrule"><b style="color:${BCOL.A}">A</b> ↔ <b style="color:${BCOL.T}">T</b> &nbsp;·&nbsp; <b style="color:${BCOL.G}">G</b> ↔ <b style="color:${BCOL.C}">C</b></span>`;
const rb=n=>Array.from({length:n},()=>pick(BASES));
function tile(b,o){o=o||{};const bg=b&&b!=='?'?BCOL[b]:'#000';
  return `<div class="tile ${o.cls||''}" ${o.attr||''} style="background:${bg};${o.ring?'outline:3px solid #fff;outline-offset:2px;':''}${o.border?'border:3px solid '+o.border+';':''}">${b||'?'}</div>`;}
function ladder(top,bot,o){o=o||{};return `<div class="ladder">${top.map((t,i)=>`<div class="rung">${tile(t,{ring:o.ringTop===i})}<div class="bond"></div>${tile(bot[i],{ring:o.ringBot===i,border:o.borders&&o.borders[i],attr:o.click?`data-a="seqAct" data-i="${i}" role="button"`:''})}</div>`).join('')}</div>`;}
const PARTNER_TXT={A:'pairs with T',T:'pairs with A',G:'pairs with C',C:'pairs with G',U:'RNA letter'};
const arcBtn=(lab,data,col,sub,cls)=>`<button class="arc ${cls||''}" style="--ac:${col};--ad:${shade(col,-.5)};--al:${shade(col,.45)}" ${data}><span class="cap">${lab}</span>${sub?`<small>${sub}</small>`:''}</button>`;
const letterBtns=(ls,noHint)=>'<!--deck-->'+`<div class="deckrow">${ls.map(b=>arcBtn(b,`data-a="seqKey" data-b="${b}"`,BCOL[b],noHint?'key '+b:PARTNER_TXT[b])).join('')}</div>`;
// each game: name, icon, how, sci, time(q), setup(q), body(q), key(q,k), act(q,d), tick(q,dt), score(q)
const SEQ_GAMES=[
 {id:'ladder',short:'See a letter ➜ press its partner',name:'Base Pairs',icon:'🪜',how:`Each letter has a partner on the other side of the DNA ladder. Press the <b>opposite</b> letter for the highlighted one. See <b>A</b>, press <b>T</b>. See <b>G</b>, press <b>C</b>.`,
  sci:'DNA is a twisted ladder. Each rung is two bases holding hands: A always pairs with T, and G always pairs with C.',

  body:q=>ladder(q.top,q.top.map((b,i)=>q.ans[i]||'?'),{ringTop:q.idx,borders:q.top.map((b,i)=>q.ans[i]?(q.ans[i]===PAIR[b]?'#b8e04a':'#ff5a68'):null)})+letterBtns(BASES),
  key(q,k){k=k.toUpperCase();if(!BASES.includes(k))return;q.ans[q.idx++]=k;if(q.idx>=q.n)seqEnd();else refreshPanel();},
  score:q=>q.top.filter((b,i)=>q.ans[i]===PAIR[b]).length/q.n},
 {id:'memory',short:'Remember ➜ type the partners',name:'Memory Strand',icon:'🧠',how:`Memorize the strand before it disappears. Then type its <b>partner</b> strand from memory, left to right.`,
  sci:'Cells copy DNA by reading one strand and building the partner strand to match it.',
  time:q=>3.5+q.n*2.2,setup(q){q.n=4+q.d;q.top=rb(q.n);q.ans=[];q.idx=0;q.showT=3.5;},

  tick(q,dt){if(q.showT>0){q.showT-=dt;const e=document.getElementById('memT');if(e)e.textContent=Math.ceil(Math.max(0,q.showT));if(q.showT<=0)refreshPanel();}},
  key(q,k){if(q.showT>0)return;k=k.toUpperCase();if(!BASES.includes(k))return;q.ans[q.idx++]=k;if(q.idx>=q.n)seqEnd();else refreshPanel();},
  score:q=>q.top.filter((b,i)=>q.ans[i]===PAIR[b]).length/q.n},
 {id:'mutation',short:'Tap the 3 wrong letters',name:'Mutation Hunt',icon:'🔍',how:`The bottom strand should be the partner of the top strand, but <b>3 letters are wrong</b>. Click the wrong ones on the bottom.`,
  sci:'A mutation is a mistake in the DNA code. Some do nothing, some cause disease, and a few are useful.',

 {id:'gaps',short:'Fill the ? with the partner',name:'Fill the Gaps',icon:'🧩',how:`The bottom strand is complete. The top strand has holes. Fill each highlighted hole with the <b>partner</b> of the letter under it.`,
  sci:'Because A only fits T and G only fits C, one strand of DNA is enough to rebuild the other.',

  body:q=>ladder(q.bot.map((b,i)=>q.gaps.includes(i)?(q.ans[i]||'?'):PAIR[b]),q.bot,{ringTop:q.gaps[q.idx]})+letterBtns(BASES),
  key(q,k){k=k.toUpperCase();if(!BASES.includes(k))return;q.ans[q.gaps[q.idx++]]=k;if(q.idx>=q.gaps.length)seqEnd();else refreshPanel();},
  score:q=>q.gaps.filter(i=>q.ans[i]===PAIR[q.bot[i]]).length/q.gaps.length},
 {id:'bonds',short:'A–T = 2 · G–C = 3',name:'Bond Count',icon:'🔗',how:`How many bonds hold this pair together? <b>A–T has 2 bonds.</b> <b>G–C has 3 bonds.</b> Click 2 or 3 (or press the 2 or 3 key).`,
  sci:'G–C pairs have 3 hydrogen bonds and A–T pairs have 2, so G–C pairs are a little harder to pull apart.',
  time:q=>q.rounds*2.6,setup(q){q.rounds=6+q.d*2;q.pairs=Array.from({length:q.rounds},()=>{const b=pick(BASES);return [b,PAIR[b]];});q.idx=0;q.right=0;q.last=null;},
  body:q=>{const [a,b]=q.pairs[q.idx]||['',''];return `<p class="big2">Pair ${q.idx+1} of ${q.rounds}${q.last!==null?` · <span style="color:${q.last?'#9dffb2':'#ff8a95'}">${q.last?'Correct!':'Not quite'}</span>`:''}</p>

    <!--deck--><div class="deckrow">${arcBtn('2','data-a="seqKey" data-b="2"','#4aa8ff','bonds · A–T')}${arcBtn('3','data-a="seqKey" data-b="3"','#5ad66a','bonds · G–C')}</div>`;},
  key(q,k){if(k!=='2'&&k!=='3')return;const [a]=q.pairs[q.idx];const ok=(a==='G'||a==='C')?k==='3':k==='2';q.last=ok;if(ok)q.right++;q.idx++;if(q.idx>=q.rounds)seqEnd();else refreshPanel();},

 {id:'rna',short:'A→U · T→A · G→C · C→G',name:'Make the RNA',icon:'📜',how:`Copy this DNA into RNA. RNA has no T. It uses <b>U</b> instead. Rules: <b>A → U</b>, <b>T → A</b>, <b>G → C</b>, <b>C → G</b>.`,

 {id:'copy',short:'Watch ➜ type the partners',name:'Copy Machine',icon:'📠',how:`Letters flash one at a time. When they stop, type the <b>partner</b> of each one, in order. 3 rounds, each one longer.`,
  sci:'DNA replication: before a cell divides, it unzips its DNA and builds a matching partner for every base.',

  body:q=>`<p class="big2">Round ${q.round+1} of 3 · ${q.phase==='show'?'Watch…':'Type the partners!'}</p>
    <div class="row" style="justify-content:center;margin:10px 0">${q.phase==='show'?`<div id="simon">${tile(' ')}</div>`:q.seq.map((b,i)=>tile(q.ans[i]||'?',{border:q.ans[i]?(q.ans[i]===PAIR[b]?'#b8e04a':'#ff5a68'):null})).join('')}</div>${q.phase==='show'?'':letterBtns(BASES)}`,
  tick(q,dt){if(q.phase!=='show')return;q.st+=dt;if(q.st<0)return;const i=Math.floor(q.st/.8),on=(q.st%.8)<.6;const e=document.getElementById('simon');

 {id:'spin',short:'Stop in the green',name:'Centrifuge',icon:'🌀',how:`Spin the sample to separate the DNA. Press <b>SPACE</b> or click <b>STOP</b> when the needle is inside the green zone. 5 tries.`,

 {id:'gel',short:'Smallest ➜ largest',name:'Gel Sort',icon:'🧫',how:`DNA pieces move through gel at different speeds. <b>Small pieces travel farthest.</b> Click the pieces from <b>smallest to largest</b>.`,
  sci:'Gel electrophoresis sorts DNA by size. Scientists use it for DNA fingerprinting and paternity tests.',

 {id:'pipette',short:'Hold ➜ let go at the line',name:'Pipette',icon:'💉',how:`Fill each tube exactly to the gold line. <b>Hold</b> the FILL button (or hold SPACE) and <b>let go</b> right at the line. 3 tubes.`,

ov.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;act(t.dataset.a,t.dataset);});
function act(a,d){
  if(a==='load'){audioInit();hideOv();if(!loadGame())showTitle();return;}
  if(a==='diff'){TITLE_DIFF=d.d;showTitle(true);return;}
  if(a==='snd'){SND=!SND;try{localStorage.setItem('splice_sound',SND?'on':'off');}catch(e){}showTitle(true);return;}
  if(a==='start'){audioInit();newGame({story:d.mode!=='conquest',diff:TITLE_DIFF});hideOv();banner('DAY 1','You wake up in a rickety shack. Walk out the door and find supplies.','#ffd166');
    toast('WASD to move · mouse to aim · click or Space to swing.');toast('Walk into a building\'s door to go inside. Hold E to search containers.');toast('The workbench, DNA lab, bed and pantry are right here in your shack. Press E next to them.');return;}
  if(a==='turn'){hideOv();startMonsterMode();return;}
  if(a==='choice'){hideOv();applyChoice(d.c,d.o);return;}
  if(a==='close'){hideOv();return;}
  if(!S)return;
  if(a==='mapsel'){S.mapSel=+d.i;refreshPanel();return;}
  if(a==='migrate'){hideOv();migrateTown();return;}
  if(a==='continue'){hideOv();return;}
  if(S.panel==='camp'){const r=campAct(a,d);if(r==='closed')return;if(r){refreshPanel();return;}}
  if(a==='leave'){S.pack={};const cap=CARGO+(S.mods.rack?10:0);let used=0;Object.keys(S.res).forEach(k=>S.pack[k]=0);
    const order=['food','meds','fuel','ammo','wire','scrap','wood'],hv=k=>Math.max(0,S.res[k]);let moved=true;
    while(used<cap&&moved){moved=false;for(const k of order){if(used<cap&&S.pack[k]<hv(k)){S.pack[k]++;used++;moved=true;}}}
    openPanel('pack');return;}
  if(a==='pk'){const k=d.k,dd=+d.d,cap=CARGO+(S.mods.rack?10:0),used=Object.values(S.pack).reduce((x,y)=>x+y,0),have=Math.max(0,S.res[k]);
    if(dd<0)S.pack[k]=Math.max(0,S.pack[k]-1);else if(used<cap&&S.pack[k]<have)S.pack[k]++;refreshPanel();return;}
  if(a==='unpack'){openPanel('bench');return;}
  if(a==='drive'){if(S.mode==='hunter')leaveTownMemory();S.res={...S.pack};showTravel();return;}
  if(a==='arrive'){hideOv();arriveTown();return;}
  if(a==='mod'){const M=MODS[d.k];if(M&&!S.mods[d.k]&&canPay(M.cost)){pay(M.cost);S.mods[d.k]=true;if(d.k==='armor')S.baseHp+=250;banner(M.name.toUpperCase()+' INSTALLED',M.desc,'#b8e04a');}}
  if(a==='upgrade'){const n=TIERS[S.tier+1];if(n&&canPay(n.cost)){pay(n.cost);S.tier++;S.maxTier=Math.max(S.maxTier||0,S.tier);S.baseHp=baseMax();S.P.hp=maxHp();makeBaseInterior();S.windows.forEach(w=>w.hp=winMax());
    const B=S.baseInt;teleport(S.P,B.x+B.w/2,B.y+B.h-90,'base');S._sol={};banner(n.name.toUpperCase()+' BUILT',n.perk,'#b8e04a');}}
  if(a==='eat'&&S.res.food>=1){S.res.food--;healPlayer(35);}
  if(a==='heal'&&S.res.meds>=1){S.res.meds--;healPlayer(45);}
  if(a==='supp'&&S.res.meds>=2){S.res.meds-=2;S.humanity=Math.min(100,S.humanity+15);S.hstage=S.humanity<25?3:S.humanity<50?2:S.humanity<75?1:0;}
  if(a==='repair'&&S.res.wood>=2&&S.res.scrap>=1){S.res.wood-=2;S.res.scrap-=1;S.baseHp=Math.min(baseMax(),S.baseHp+80);}
  if(a==='board'&&S.res.wood>=3){S.res.wood-=3;S.windows.forEach(w=>w.hp=winMax());}
  if(a==='ammo'&&S.res.scrap>=2){S.res.scrap-=2;S.res.ammo+=6;}
  if(a==='craft'){const W=WEAPONS[d.w];if(W&&W.cost&&canPay(W.cost)&&!S.weapons.includes(d.w)){pay(W.cost);S.weapons.push(d.w);S.wpn=S.weapons.length-1;if(W.ranged)S.res.ammo+=6;toast('Crafted the '+W.name+'. It\'s in your hands.','good');}}
  if(a==='wield'){const i=S.weapons.indexOf(d.w);if(i>=0)S.wpn=i;}
  if(a==='eqs'){const id=d.id,i=+d.i,j=S.slots.indexOf(id);if(j>=0)S.slots[j]=S.slots[i];S.slots[i]=id;}
  if(a==='clr')S.slots[+d.i]=null;
  if(a==='eqt'){const id=d.id,i=+d.i,j=S.traits.indexOf(id);if(j>=0)S.traits[j]=S.traits[i];S.traits[i]=id;}
  if(a==='clrt')S.traits[+d.i]=null;
  if(a==='gtab'){S.gtab=d.t;if(d.t==='seq'&&S.seq&&S.seq.done)S.seq=null;if(d.t!=='splice')S.splicePick=[];}
  if(a==='gfam')S.gfam=d.f;
  if(a==='absorb'){const v=S.vault.find(x=>x.id==d.v);if(v){S.vault=S.vault.filter(x=>x!==v);addDNA(v.gene,Math.round(v.val*.5));}}
  if(a==='absorbAll'){const vs=S.vault;S.vault=[];vs.forEach(v=>addDNA(v.gene,Math.round(v.val*.5)));}
  if(a==='seqStart'&&atLab())seqStart(d.v);
  if(a==='seqKey')seqPress(d.b);
  if(a==='seqAct'){seqActIn(d);return;}
  if(a==='seqGo'){seqGo();return;}
  if(a==='seqPractice'){S.seq=null;seqStart('practice',d.g);refreshPanel();return;}
  if(a==='logcat'){S.logCat=d.c;refreshPanel();return;}
  if(garageAct(a,d)){refreshPanel();return;}
  if(menuAct(a))return;
  if(a==='addmod'){const id=d.id,cur=S.gmods[id]||[];if(S.res.mutagen>=1&&atLab()&&cur.length<modSlots(id)){S.res.mutagen--;const m=pick(Object.keys(GMODS).filter(x=>!cur.includes(x)));S.gmods[id]=cur.concat(m);toast('Mutagen worked: '+POWERS[id].name+' is now '+GMODS[m].name+' ('+GMODS[m].desc+').','good');}}
  if(a==='evo'){const k=d.k,c=k==='nest'?10:EVO[k].base+S.evo[k]*6;if(S.biomass>=c){S.biomass-=c;if(k==='nest')S.nestHp=Math.min(NEST_MAX,S.nestHp+200);else S.evo[k]++;if(k==='hp')S.P.hp+=30;}}
  if(a==='spk'){const id=d.id,i=S.splicePick.indexOf(id);if(i>=0)S.splicePick.splice(i,1);else{S.splicePick.push(id);if(S.splicePick.length>2)S.splicePick.shift();}}
  if(a==='doSplice'&&S.splicePick.length===2&&atLab()&&(S.mode==='monster'||Math.max(S.tier,S.maxTier||0)>=3)){
    if(S.mode==='monster'){if(S.biomass<30)return;S.biomass-=30;}else{if(S.res.wire<2||S.res.meds<2)return;S.res.wire-=2;S.res.meds-=2;}
    doSplice(S.splicePick[0],S.splicePick[1]);S.splicePick=[];if(S.mode==='hunter')humanityHit(8);
    if(S.mode!=='hunter'&&S.mode!=='monster')return;}
  if(S.panel)refreshPanel();
}
